<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFlowershop - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-green': '#38761D',
                        'secondary-pink': '#FEE8E9',
                        'accent-red': '#E96677',
                        'neutral-light': '#FAF5F5',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-neutral-light font-sans text-primary-green min-h-screen flex flex-col">

    <header class="bg-white shadow-md sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="home.html" class="text-3xl font-display font-bold text-accent-red">DFlowershop</a>
            
            <button id="mobile-menu-button" class="md:hidden p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-accent-red">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
            </button>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-100">
            <a href="home.html" class="block px-4 py-2 text-primary-green hover:bg-secondary-pink mobile-link">Home</a>
            <a href="about.html" class="block px-4 py-2 text-primary-green hover:bg-secondary-pink mobile-link">About Us</a>
            <a href="contact.html" class="block px-4 py-2 text-primary-green hover:bg-secondary-pink mobile-link">Contact</a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center py-16 px-4">
        <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
            <h2 class="text-center font-display text-4xl font-bold mb-6 text-accent-red">Login</h2>
            
            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="role" class="block text-sm font-medium text-primary-green mb-1">I am a:</label>
                    <select id="role" name="role" required 
                        class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-accent-red focus:border-accent-red text-primary-green bg-white">
                        <option value="user">Customer</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div class="relative">
                    <label for="username" class="block text-sm font-medium text-primary-green mb-1">Username</label>
                    <input type="text" id="username" name="username" required 
                        class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-accent-red focus:border-accent-red text-primary-green placeholder-gray-400"
                        placeholder="Enter your username">
                </div>

                <div class="relative">
                    <label for="password" class="block text-sm font-medium text-primary-green mb-1">Password</label>
                    <input type="password" id="password" name="password" required 
                        class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-accent-red focus:border-accent-red text-primary-green placeholder-gray-400"
                        placeholder="••••••••">
                </div>
                
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-gray-600">
                        <input type="checkbox" class="rounded text-accent-red focus:ring-accent-red mr-2"> Remember me
                    </label>
                    <a href="#" class="text-accent-red hover:underline">Forgot Password?</a>
                </div>

                <button type="submit" 
                    class="w-full py-3 px-4 border border-transparent rounded-full shadow-sm text-lg font-semibold text-white bg-accent-red hover:bg-accent-red/90 transition duration-150 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent-red">
                    Sign In
                </button>

                <div class="text-center pt-4">
                    <p class="text-gray-500">Don't have an account? 
                        <a href="register.html" class="font-medium text-primary-green hover:text-accent-red transition duration-150">Register</a>
                    </p>
                </div>
            </form>
        </div>
    </main>



    <script>
        // Form Logic
        const loginForm = document.getElementById('loginForm');
        
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const role = document.getElementById('role').value;

            if (role === 'admin') {
                // Redirect to Admin Dashboard
                alert(`Welcome back, Administrator ${username}!`);
                window.location.href = 'admin_dashboard.html'; 
            } else {
                // Redirect to User Home
                alert(`Welcome back, ${username}!`);
                window.location.href = 'home.html'; 
            }
        });

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFlowershop - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-green': '#38761D',
                        'secondary-pink': '#FEE8E9',
                        'accent-red': '#E96677',
                        'neutral-light': '#FAF5F5',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-neutral-light font-sans text-primary-green min-h-screen flex flex-col">

    <header class="bg-white shadow-md sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="home.html" class="text-3xl font-display font-bold text-accent-red">
                DFlowershop
            </a>
            <div class="flex items-center space-x-4">
                <a href="indexlog.html" class="p-2 rounded-md hover:bg-secondary-pink transition duration-150">
                    <svg class="w-6 h-6 text-primary-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </a>
            </div>
        </div>
    </header>
    
    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl border border-gray-100">
            <h2 class="text-center font-display text-4xl font-bold mb-2 text-accent-red">
                Create Account
            </h2>
            <p class="text-center text-gray-500 mb-8 text-sm">
                Join our community for fresh blooms and exclusive offers.
            </p>

            <form id="registration-form" class="space-y-5">
                <div>
                    <label for="name" class="block text-xs font-bold uppercase tracking-wider text-primary-green mb-1">Full Name</label>
                    <input type="text" id="name" required class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-accent-red outline-none transition" placeholder="Juan Dela Cruz">
                </div>
                
                <div>
                    <label for="email" class="block text-xs font-bold uppercase tracking-wider text-primary-green mb-1">Email Address</label>
                    <input type="email" id="email" required class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-accent-red outline-none transition" placeholder="juan@email.com">
                </div>

                <div>
                    <label for="role" class="block text-xs font-bold uppercase tracking-wider text-primary-green mb-1">Account Type</label>
                    <select id="role" required class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-accent-red outline-none bg-white transition cursor-pointer">
                        <option value="user">Customer</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                
                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label for="password" class="block text-xs font-bold uppercase tracking-wider text-primary-green mb-1">Password</label>
                        <input type="password" id="password" required class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-accent-red outline-none transition" placeholder="••••••••">
                    </div>
                    <div>
                        <label for="confirm-password" class="block text-xs font-bold uppercase tracking-wider text-primary-green mb-1">Confirm</label>
                        <input type="password" id="confirm-password" required class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-accent-red outline-none transition" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="w-full py-4 bg-accent-red text-white rounded-full font-bold text-lg shadow-lg hover:bg-red-500 transform hover:-translate-y-0.5 transition active:scale-95">
                    Register Now
                </button>
            </form>

            <p class="mt-8 text-center text-sm text-gray-500">
                Already have an account? 
                <a href="indexlog.html" class="font-bold text-primary-green hover:underline">Sign in here</a>
            </p>
        </div>
    </main>

    <script>
        document.getElementById('registration-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get input values
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const role = document.getElementById('role').value;

            // 1. Basic Validation
            if (password !== confirmPassword) {
                alert('Passwords do not match. Please try again.');
                return;
            }
            if (password.length < 8) {
                alert('Password must be at least 8 characters long.');
                return;
            }

            // 2. Create User Object
            const userData = {
                name: name,
                email: email,
                role: role,
                points: role === 'admin' ? 0 : 100, // New users get 100 points
                joinedDate: new Date().toISOString().split('T')[0]
            };

            // 3. Save to LocalStorage
            // Save as active user for the current session
            localStorage.setItem('dflowershop_active_user', JSON.stringify(userData));
            localStorage.setItem('dflowershop_loggedIn', 'true');

            // 4. Role-Based Redirection
            alert(`Registration successful! Welcome, ${name}.`);
            
            if (role === 'admin') {
                // Ensure your admin dashboard file is named 'admin_dashboard.html'
                window.location.href = 'admin_dashboard.html';
            } else {
                // Ensure your user dashboard file is named 'user_dashboard.html'
                window.location.href = 'userdash.html';
            }
        });
    </script>
</body>
</html>
